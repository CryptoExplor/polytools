# Standalone Worker deploy for the API + alert bot.
# This is the backend GitHub Pages frontends will call.
name = "poly-tools-backend"
main = "adapters/worker.ts"
compatibility_date = "2025-10-01"

# Optional explicit override (defaults to the testnet MCP endpoint in code):
# [vars]
# MCP_URL = "https://polyester-mcp-testnet.fabriclabs.workers.dev/mcp"
# ALERT_MIN_BPS = "300"

[triggers]
crons = ["*/15 * * * *"]

# Secrets (set once, never in this file):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
