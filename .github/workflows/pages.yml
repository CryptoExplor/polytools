# GitHub Pages deploy — static SPA only.
#
# IMPORTANT: GitHub Pages cannot run the backend. Deploy the standalone
# worker once (cd backend && npx wrangler deploy) and set the repo variable
# VITE_API_BASE to its URL, e.g. https://poly-tools-backend.<you>.workers.dev
# The app then calls the worker for all /api data.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - name: Build static app
        run: npm -w apps/web run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: SPA fallback (serve index.html for every route)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
