name: Verify

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run check:whitespace
      - run: npm run check:external
      - run: npm run check:dependencies
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:performance
